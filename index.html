<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Music Player</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="app-container">
        <header id="title-bar">
            <h1>My Music Player</h1>
        </header>
        <div id="content-area">
            <aside id="sidebar">
                <p>Sidebar (Playlists / Library Navigation)</p>
                <ul id="music-list">

                </ul>
            </aside>
            <main id="main-view">
                <p>Main View (Song List / Album Art / Search)</p>
            </main>
        </div>
        <div id="progress-container">
            <div id="progress-filled"></div>
        </div>
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" ... />
        <span id="duration">0:00</span>
        <div class="songDisplay">
            <ul>
                <li>
                    <div>Title:</div>
                    <div id="songTitle"></div>
                </li>
                <li>
                    <div>Artist:</div>
                    <div id="songArtist"></div>
                </li>
                <li>
                    <div>Album:</div>
                    <div id="songAlbum"></div>
                </li>
                <li>
                    <div>Year:</div>
                    <div id="songYear"></div>
                </li>
                <li>
                    <div>Genre:</div>
                    <div id="songGenre"></div>
                </li>
            </ul>
        </div>
        <div class="loader">
            <button id="upload">Select files</button>
            <button id="clear">Clear list</button>
            <button id="delete">Delete song</button>
            <span id="file-count" class="notification"
                style="margin-left: 10px; font-weight: bold; margin-bottom: 10px">Hey dodaj jakieś piosenki... bo tak
                jakoś pusto na tej playliście 😄 🎶</span>
        </div>
        <audio id="audioPlayer"></audio>
        <footer id="player-controls">
            <div id="player-controls" class="player-controls">
                <button id="play-pause-btn">▶️ Play</button>
                <!-- <button id="stop-btn">⏹️ Stop</button> -->
                <button id="prev-btn">⏮️ Previous</button>
                <button id="play-pause-btn">▶️ Play</button>
                <button id="next-btn">⏭️ Next</button>
                <button id="stop-btn">⏹️ Stop</button>

                <!-- Now Playing Display -->
                <div id="now-playing" class="now-playing">
                    <span class="music-note">🎵</span>
                    <span id="song-title"></span>
                    <span id="song-artist"></span>
                </div>

                <!-- Volume Control -->
                <label for="volume-slider">Volume:</label>
                <input type="range" id="volume-slider" min="0" max="100" value="75" />
            </div>
        </footer>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
